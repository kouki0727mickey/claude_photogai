<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>claude_photogai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;800&family=Noto+Sans+JP:wght@400;900&family=Zen+Old+Mincho:wght@400;900&display=swap"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">claude_photogai</span>
      <button data-action="new" title="新しい画像">新規</button>
      <button data-action="open" title="画像またはプロジェクトを開く">開く</button>
      <button data-action="save" title="プロジェクトを保存（Ctrl+S）">保存</button>
      <button data-action="add-image" title="画像をレイヤーとして追加（貼り付け・ドロップでも可）">画像を追加</button>
      <span class="sep"></span>
      <button data-action="export-png">PNG で書き出し</button>
      <button data-action="export-jpeg">JPEG で書き出し</button>
      <span class="sep"></span>
      <button data-action="undo" title="元に戻す（Ctrl+Z）">↶ 戻す</button>
      <button data-action="redo" title="やり直す（Ctrl+Shift+Z）">↷ やり直す</button>
      <span class="sep"></span>
      <button data-action="adjust" title="明るさ・コントラスト・彩度・色相">色調補正</button>
    </header>

    <div class="main">
      <nav class="toolbar" aria-label="ツール">
        <button data-tool="move" title="移動（V）">移動</button>
        <button data-tool="brush" title="ブラシ（B）">ブラシ</button>
        <button data-tool="eraser" title="消しゴム（E）">消しゴム</button>
        <button data-tool="fill" title="塗りつぶし（G）">塗りつぶし</button>
        <button data-tool="rect" title="四角形（U）。Shift で正方形">四角形</button>
        <button data-tool="ellipse" title="楕円（O）。Shift で正円">楕円</button>
        <button data-tool="text" title="文字（T）">文字</button>
        <button data-tool="eyedropper" title="スポイト（I）">スポイト</button>
      </nav>

      <div class="stage" id="stage">
        <canvas id="view"></canvas>
      </div>

      <aside class="panel">
        <section>
          <h2>ツール</h2>
          <label class="row">色 <input type="color" id="opt-color" /></label>
          <div class="swatches" id="swatches"></div>
          <label class="row" data-for="brush eraser rect ellipse">
            太さ <input type="range" id="opt-size" min="1" max="300" /> <output id="opt-size-out"></output>
          </label>
          <label class="row" data-for="brush eraser rect ellipse fill">
            不透明度 <input type="range" id="opt-opacity" min="1" max="100" /> <output id="opt-opacity-out"></output>
          </label>
          <label class="row" data-for="fill">
            許容範囲 <input type="range" id="opt-tolerance" min="0" max="128" /> <output id="opt-tolerance-out"></output>
          </label>
          <label class="row" data-for="rect ellipse">
            <input type="checkbox" id="opt-shape-fill" /> 塗りつぶす（オフで線だけ）
          </label>
          <p class="hint" data-for="move">ドラッグで選択中のレイヤーを動かします。</p>
          <p class="hint" data-for="text">クリックした場所に文字レイヤーを作ります。</p>
          <p class="hint" data-for="eyedropper">クリックした場所の色を取ります。</p>
        </section>

        <section id="text-options" hidden>
          <h2>文字</h2>
          <textarea id="txt-text" rows="3"></textarea>
          <label class="row">フォント <select id="txt-font"></select></label>
          <label class="row">大きさ <input type="number" id="txt-size" min="4" max="1000" /></label>
          <label class="row">文字の色 <input type="color" id="txt-color" /></label>
          <label class="row"><input type="checkbox" id="txt-bold" /> 太字</label>
          <label class="row">縁の色 <input type="color" id="txt-stroke-color" /></label>
          <label class="row">
            縁の太さ <input type="range" id="txt-stroke-width" min="0" max="40" /> <output id="txt-stroke-width-out"></output>
          </label>
          <label class="row"><input type="checkbox" id="txt-shadow" /> 影</label>
          <button id="txt-rasterize" title="画像に変換して、ブラシなどで描けるようにする">ラスタライズ</button>
        </section>

        <section class="layers">
          <h2>レイヤー</h2>
          <label class="row">描画モード <select id="layer-blend"></select></label>
          <label class="row">
            不透明度 <input type="range" id="layer-opacity" min="0" max="100" /> <output id="layer-opacity-out"></output>
          </label>
          <ul id="layer-list"></ul>
          <div class="layer-buttons">
            <button data-action="layer-add" title="新しいレイヤー">＋</button>
            <button data-action="layer-dup" title="複製">複製</button>
            <button data-action="layer-up" title="上へ">▲</button>
            <button data-action="layer-down" title="下へ">▼</button>
            <button data-action="layer-merge" title="下のレイヤーと結合">結合</button>
            <button data-action="layer-delete" title="削除">削除</button>
          </div>
        </section>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="status-size"></span>
      <span id="status-pos"></span>
      <span class="spacer"></span>
      <button data-action="zoom-out">－</button>
      <span id="status-zoom"></span>
      <button data-action="zoom-in">＋</button>
      <button data-action="zoom-fit" title="Ctrl+0">全体</button>
      <button data-action="zoom-100" title="Ctrl+1">100%</button>
    </footer>

    <dialog id="new-dialog">
      <form method="dialog">
        <h2>新しい画像</h2>
        <label class="row">
          サイズ
          <select id="new-preset">
            <option value="1280x720">YouTube サムネイル（1280×720）</option>
            <option value="1920x1080">フル HD（1920×1080）</option>
            <option value="1080x1080">正方形（1080×1080）</option>
            <option value="1080x1350">縦長投稿（1080×1350）</option>
            <option value="1080x1920">縦長動画（1080×1920）</option>
            <option value="1500x500">X ヘッダー（1500×500）</option>
            <option value="custom">自由に指定</option>
          </select>
        </label>
        <label class="row">幅 <input type="number" id="new-width" min="1" max="8000" /></label>
        <label class="row">高さ <input type="number" id="new-height" min="1" max="8000" /></label>
        <label class="row">
          背景
          <select id="new-bg">
            <option value="#ffffff">白</option>
            <option value="#000000">黒</option>
            <option value="">透明</option>
          </select>
        </label>
        <div class="dialog-buttons">
          <button value="cancel">キャンセル</button>
          <button value="ok" class="primary">作成</button>
        </div>
      </form>
    </dialog>

    <dialog id="adjust-dialog">
      <form method="dialog">
        <h2>色調補正</h2>
        <label class="row">明るさ <input type="range" id="adj-brightness" min="-100" max="100" /> <output></output></label>
        <label class="row">コントラスト <input type="range" id="adj-contrast" min="-100" max="100" /> <output></output></label>
        <label class="row">彩度 <input type="range" id="adj-saturation" min="-100" max="100" /> <output></output></label>
        <label class="row">色相 <input type="range" id="adj-hue" min="-180" max="180" /> <output></output></label>
        <div class="dialog-buttons">
          <button value="cancel">キャンセル</button>
          <button value="ok" class="primary">適用</button>
        </div>
      </form>
    </dialog>

    <input type="file" id="file-open" accept="image/*,.json,application/json" hidden />
    <input type="file" id="file-image" accept="image/*" multiple hidden />
    <div id="toast" role="status"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
